<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مزامنة خطة العمل مع Google Sheets — AI OS</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 22px; margin-bottom: 6px; color: #60a5fa; }
    .header p { color: var(--text-muted); font-size: 13px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; font-size: 15px; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: white; width: 100%; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; background: rgba(0,0,0,0.2); }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
    .badge-task { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .badge-idea { background: rgba(245, 158, 11, 0.2); color: #fde68a; }
    .badge-decision { background: rgba(16, 185, 129, 0.2); color: #a7f3d0; }
    .status-cell { font-weight: bold; width: 120px; text-align: center; }
    .status-pending { color: var(--text-muted); }
    .status-syncing { color: var(--warning); }
    .status-done { color: var(--success); }
    .status-err { color: var(--danger); }
    .progress-bar-container { width: 100%; height: 10px; background: #0f172a; border-radius: 5px; overflow: hidden; margin: 14px 0; }
    .progress-bar { height: 100%; width: 0%; background: #10b981; transition: width 0.3s ease; }
    .status-box { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: #a7f3d0; padding: 14px; border-radius: 8px; margin-top: 12px; text-align: center; font-weight: 600; font-size: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 مزامنة خطة العمل إلى Google Sheets</h1>
      <p>الإرسال المباشر إلى تبويب <strong>مدخلات الوكيل</strong> عبر الـ Webhook</p>
    </div>

    <div class="card">
      <button id="syncBtn" class="btn btn-primary" onclick="startSync()">
        <span>📤 إعادة الإرسال إلى Google Sheets الآن</span>
      </button>

      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="statusBox" class="status-box">
        ⏳ جاري بدء الإرسال التلقائي إلى جدول Google Sheets...
      </div>
    </div>

    <div class="card">
      <h3 style="font-size: 15px; margin-bottom: 10px; color: #94a3b8;">تفاصيل البنود الـ 10 وحالة إرسالها:</h3>
      <table>
        <thead>
          <tr>
            <th>التصنيف</th>
            <th>العنوان</th>
            <th>النوع</th>
            <th>الأولوية</th>
            <th>الموعد</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody id="taskRows">
          <!-- Injected via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const url = "https://script.google.com/macros/s/AKfycbzukkMQpo6fpBKfuzHDNl82b-BoFKRokVI6N_baejWul9hVgMzNoC4zBf4vv1OpQiQ_/exec";
    const secret = "Iamthe@best555";

    const tasks = [
      { category: "مهمة", title: "مذبحة التابات وإغلاق النوافذ غير الضرورية", type: "شخصي", priority: "عالية", due: "2026-09-07", note: "الإبقاء على 3 تابات عمل فقط وأرشفة/إغلاق الباقي" },
      { category: "مهمة", title: "تصفية 3 مهام معلقة سريعة (أقل من 5 دقائق)", type: "عمل", priority: "عالية", due: "2026-09-07", note: "إنجازها دفعة واحدة في 15 دقيقة لكسر التسويف" },
      { category: "مهمة", title: "ترتيب مكان شحن الهاتف بعيداً عن السرير", type: "شخصي", priority: "متوسطة", due: "2026-09-07", note: "شاحن سليم ومكانه يبعد خطوتين على الأقل عن السرير" },
      { category: "مهمة", title: "إعادة ضبط نظام المنبهات (منبهين فقط)", type: "شخصي", priority: "عالية", due: "2026-09-08", note: "المنبه الأساسي + منبه طوارئ بعد 15 دقيقة فقط" },
      { category: "مهمة", title: "تطبيق قاعدة المهام الثلاث الرئيسية لليوم", type: "عمل", priority: "عالية", due: "2026-09-08", note: "تحديد أهم 3 مهام يومياً وإنجاز المهمة الكبرى صباحاً" },
      { category: "مهمة", title: "جلستان عمل عميق ومكثف (Deep Work - 25 دقيقة)", type: "عمل", priority: "متوسطة", due: "2026-09-09", note: "التركيز بدون مقاطعات أو هاتف بنظام بومودورو" },
      { category: "مهمة", title: "نشاط بدني خفيف وشرب 2 لتر ماء", type: "صحة", priority: "متوسطة", due: "2026-09-10", note: "مشي 20 دقيقة والحفاظ على ترطيب الجسم طوال اليوم" },
      { category: "مهمة", title: "جلسة مراجعة أسبوعية وتخطيط الأسبوع القادم", type: "تطوير", priority: "متوسطة", due: "2026-09-13", note: "تقييم ما تم إنجازه وتحديد أولويات الـ 3 مهام للأسبوع الجديد" },
      { category: "فكرة", title: "نظام الحد الأدنى الفعّال (Minimum Effective Dose)", type: "تطوير", priority: "متوسطة", due: "", note: "الاعتماد على استمرارية 20% لتحقيق 80% من النتائج بدلاً من المثالية المرهقة" },
      { category: "قرار", title: "الالتزام بإنهاء المهام القصيرة فوراً (قاعدة الـ 5 دقائق)", type: "تطوير", priority: "عالية", due: "2026-09-07", note: "أي مهمة تستغرق أقل من 5 دقائق تنفذ فوراً دون تأجيل" }
    ];

    function renderTable() {
      const tbody = document.getElementById("taskRows");
      tbody.innerHTML = tasks.map((t, idx) => `
        <tr>
          <td><span class="badge ${t.category === 'مهمة' ? 'badge-task' : (t.category === 'فكرة' ? 'badge-idea' : 'badge-decision')}">${t.category}</span></td>
          <td style="font-weight: 500;">${t.title}</td>
          <td>${t.type}</td>
          <td>${t.priority}</td>
          <td>${t.due || '—'}</td>
          <td id="status-${idx}" class="status-cell status-pending">في الانتظار</td>
        </tr>
      `).join('');
    }

    async function startSync() {
      const btn = document.getElementById("syncBtn");
      const progressBar = document.getElementById("progressBar");
      const statusBox = document.getElementById("statusBox");

      btn.disabled = true;
      statusBox.style.display = "block";
      statusBox.textContent = "🚀 جاري إرسال البنود إلى Google Sheets...";

      let completed = 0;

      for (let i = 0; i < tasks.length; i++) {
        const t = tasks[i];
        const statusEl = document.getElementById(`status-${i}`);
        statusEl.className = "status-cell status-syncing";
        statusEl.textContent = "جاري الإرسال...";

        const row = ["2026-09-07", t.category, t.title, t.type, t.priority, t.due, t.note];
        const payload = {
          action: "append",
          tab: "مدخلات الوكيل",
          secret: secret,
          row: row
        };

        try {
          await fetch(url, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          statusEl.className = "status-cell status-done";
          statusEl.textContent = "✓ تم الإرسال";
        } catch (err) {
          statusEl.className = "status-cell status-err";
          statusEl.textContent = "✕ خطأ";
        }

        completed++;
        progressBar.style.width = `${(completed / tasks.length) * 100}%`;
        await new Promise(r => setTimeout(r, 200));
      }

      btn.disabled = false;
      statusBox.innerHTML = "🎉 <strong>تم إرسال كافة البنود الـ 10 بنجاح إلى جدول Google Sheets الخاص بك!</strong>";
    }

    renderTable();
    // Auto start on page load
    window.addEventListener("load", () => {
      setTimeout(startSync, 500);
    });
  </script>
</body>
</html>
